image: openjdk:17-jdk

variables:
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/android-sdk"

before_script:
  - mkdir -p "$ANDROID_SDK_ROOT"
  - curl -s https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip -o cmdline-tools.zip
  - unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT"
  - mv "$ANDROID_SDK_ROOT/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools-temp"
  - mkdir "$ANDROID_SDK_ROOT/cmdline-tools"
  - mv "$ANDROID_SDK_ROOT/cmdline-tools-temp" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
  - yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-$ANDROID_COMPILE_SDK" "build-tools;$ANDROID_BUILD_TOOLS"
  - export PATH="$PATH:$ANDROID_SDK_ROOT/platform-tools"
  - chmod +x ./gradlew

stages:
  - build
  - test
  - deploy

build:
  stage: build
  script:
    - ./gradlew assembleDebug
  artifacts:
    paths:
      - app/build/outputs/apk/debug/app-debug.apk

test:
  stage: test
  script:
    - ./gradlew testDebugUnitTest

deploy:
  stage: deploy
  script:
    - echo "Deploy stage (можно настроить деплой в Firebase App Distribution или Play Store)"
